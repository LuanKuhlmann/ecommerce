spring:
  application:
    group: "io.luankuhlmann "
    name: "ecommerce-project"
  datasource:
    url: jdbc:mysql://localhost:3307/ecommerce
    username: ecommerce_user
    password: ecommerce_pass
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8080
  servlet:
    context-path: /ecommerce

jwt:
  public-key: ${JWT_PUBLIC_KEY_PATH:classpath:certs/public.key}
  private-key: ${JWT_PRIVATE_KEY_PATH:classpath:certs/private.key}
  jwk-key: chave-jwk #provisoria
  expires-access: 900 #900
  expires-refresh: 1800 #1800
  expires-refresh-long: 604800 #604800
  expires-temp: 900